name: Deterministic Clubs API Sync

on:
  schedule:
    - cron: '0 1 * * *' # רץ אוטומטית כל לילה ב-03:00 שעון ישראל
  workflow_dispatch:     # מאפשר הרצה ידנית בלחיצת כפתור מתוך לשונית Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Deterministic API Sync
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/syncAllClubs.js